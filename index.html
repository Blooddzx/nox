<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxClient</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0B0B1A;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные частицы на фоне */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: #8B5CF6;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.3;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(0.2);
                opacity: 0;
            }
        }

        /* Лёгкое свечение в центре */
        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            user-select: none;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            animation: fadeInDown 1s ease-out;
        }

        .nox {
            color: #8B5CF6;
        }

        .client {
            color: #FFFFFF;
        }

        .big-button {
            display: inline-block;
            border: 2px solid #8B5CF6;
            border-radius: 12px;
            padding: 40px 50px;
            margin-bottom: 40px;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            cursor: default;
            background: rgba(139, 92, 246, 0.05);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .big-button:hover {
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.7);
            transform: translateY(-5px);
        }

        .big-button p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #FFFFFF;
            margin: 0;
        }

        .small-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .small-button {
            display: inline-block;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            color: #FFFFFF;
            transition: box-shadow 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
            background-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .small-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .small-button:hover::before {
            left: 0;
        }

        .small-button:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        /* Анимации появления */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .big-button {
                padding: 30px 25px;
                margin-bottom: 30px;
            }

            .big-button p {
                font-size: 1rem;
            }

            .small-button {
                padding: 10px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Фон с частицами -->
    <div class="particles" id="particles"></div>
    <div class="glow"></div>

    <div class="container">
        <h1>
            <span class="nox">NOX</span><span class="client">CLIENT</span>
        </h1>

        <div class="big-button">
            <p>
                NoxClient — лёгкий лаунчер с визуалами и системой аккаунтов.<br>
                Полностью настраиваемый, быстрый и безопасный.<br>
                Присоединяйся к новой эре Minecraft.
            </p>
        </div>

        <div class="small-buttons">
            <a href="#" class="small-button">Купить</a>
            <a href="#" class="small-button">Скачать</a>
        </div>
    </div>

    <script>
        // Генерация случайных частиц
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 6 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            
            const duration = Math.random() * 10 + 5;
            particle.style.animationDuration = duration + 's';
            
            const delay = Math.random() * 10;
            particle.style.animationDelay = delay + 's';
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
        </html>
