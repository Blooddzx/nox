<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxClient</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0B0B1A;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            user-select: none;
        }

        .nox {
            color: #8B5CF6;
        }

        .client {
            color: #FFFFFF;
        }

        .big-button {
            display: inline-block;
            border: 2px solid #8B5CF6;
            border-radius: 12px;
            padding: 40px 50px;
            margin-bottom: 40px;
            transition: box-shadow 0.3s ease;
            cursor: default;
        }

        .big-button:hover {
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
        }

        .big-button p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #FFFFFF;
            margin: 0;
        }

        .small-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .small-button {
            display: inline-block;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            color: #FFFFFF;
            transition: box-shadow 0.3s ease, background-color 0.3s ease;
            background-color: transparent;
        }

        .small-button:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .big-button {
                padding: 30px 25px;
                margin-bottom: 30px;
            }

            .big-button p {
                font-size: 1rem;
            }

            .small-button {
                padding: 10px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="nox">NOX</span><span class="client">CLIENT</span>
        </h1>

        <div class="big-button">
            <p>
                NoxClient — лёгкий лаунчер с визуалами и системой аккаунтов.<br>
                Полностью настраиваемый, быстрый и безопасный.<br>
                Присоединяйся к новой эре Minecraft.
            </p>
        </div>

        <div class="small-buttons">
            <a href="#" class="small-button">Купить</a>
            <a href="#" class="small-button">Скачать</a>
        </div>
    </div>
</body>
</html>
